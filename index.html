<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>S&A Transporte GmbH | Zuverlässig in Bewegung</title>

    <meta
        name="description"
        content="S&A Transporte GmbH – professionelle und zuverlässige Transportlösungen in Deutschland und Europa."
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #15130f;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        .website {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: flex-start;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 78% 25%,
                    rgba(189, 125, 50, 0.12),
                    transparent 35%
                ),
                #15130f;
        }

        .project {
            position: relative;

            width: 100%;
            max-width: 1920px;

            margin: 0 auto;

            overflow: hidden;

            box-shadow:
                0 15px 50px rgba(0, 0, 0, 0.45);
        }

        .project-image {
            display: block;

            width: 100%;
            height: auto;

            object-fit: contain;

            user-select: none;
            -webkit-user-drag: none;
        }

        /*
        ==============================================
        KLIKALNE MENU

        Elementy są przezroczyste.
        Leżą dokładnie nad menu widocznym
        na zaakceptowanym projekcie.
        ==============================================
        */

        .menu-link {
            position: absolute;
            top: 3.5%;
            height: 8%;

            z-index: 10;

            text-indent: -9999px;
            overflow: hidden;

            cursor: pointer;
        }

        .menu-start {
            left: 45%;
            width: 7%;
        }

        .menu-leistungen {
            left: 52%;
            width: 10%;
        }

        .menu-flotte {
            left: 62%;
            width: 7%;
        }

        .menu-ueber-uns {
            left: 69%;
            width: 9%;
        }

        .menu-kontakt {
            left: 78%;
            width: 8%;
        }

        /*
        ==============================================
        SEKCJE DO PRZEWIJANIA

        Na razie pozostawiamy zaakceptowaną stronę
        dokładnie taką, jak wygląda na projekcie.

        Następne sekcje można później dobudować
        pod spodem bez ruszania strony głównej.
        ==============================================
        */

        #start,
        #leistungen,
        #flotte,
        #ueber-uns,
        #kontakt {
            scroll-margin-top: 20px;
        }

        /*
        ==============================================
        TELEFON / TABLET

        Zachowujemy cały projekt.
        Niczego nie obcinamy.
        ==============================================
        */

        @media (max-width: 900px) {

            .website {
                min-height: auto;
            }

            .project {
                width: 100%;
            }

            .project-image {
                width: 100%;
                height: auto;
            }
        }

        @media (max-width: 600px) {

            body {
                background: #15130f;
            }

            .project {
                box-shadow: none;
            }
        }
    </style>
</head>

<body>

<main class="website" id="start">

    <div class="project">

        <!--
        ==============================================
        ZAAKCEPTOWANY PROJEKT S&A TRANSPORTE
        ==============================================
        -->

        <img
            class="project-image"
            src="sa-transport-projekt.png"
            alt="S&A Transporte GmbH – Zuverlässig in Bewegung"
        >

        <!-- KLIKALNE MENU -->

        <a
            class="menu-link menu-start"
            href="#start"
            aria-label="Start"
        >
            Start
        </a>

        <a
            class="menu-link menu-leistungen"
            href="#leistungen"
            aria-label="Leistungen"
        >
            Leistungen
        </a>

        <a
            class="menu-link menu-flotte"
            href="#flotte"
            aria-label="Flotte"
        >
            Flotte
        </a>

        <a
            class="menu-link menu-ueber-uns"
            href="#ueber-uns"
            aria-label="Über uns"
        >
            Über uns
        </a>

        <a
            class="menu-link menu-kontakt"
            href="#kontakt"
            aria-label="Kontakt"
        >
            Kontakt
        </a>

    </div>

</main>

<!--
==================================================
PUNKTY DO PÓŹNIEJSZEJ ROZBUDOWY STRONY
==================================================
-->

<div id="leistungen"></div>
<div id="flotte"></div>
<div id="ueber-uns"></div>
<div id="kontakt"></div>

</body>
</html>
